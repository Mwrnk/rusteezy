[package]
name = "rusteezy"
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
description = "A GPU-accelerated ASCII renderer: a character grid drawn in one instanced call, with bloom, smooth color tweens and particles"
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/Mwrnk/rusteezy"
documentation = "https://docs.rs/rusteezy"
keywords = ["ascii", "wgpu", "terminal", "bloom", "text-mode"]
categories = ["graphics", "rendering", "game-development", "visualization"]
# Keep the published crate small: no GIFs, docs or CI files.
include = [
    "/src",
    "/examples",
    "/assets/fonts",
    "/assets/logo/crab.txt",
    "/README.md",
    "/CHANGELOG.md",
    "/LICENSE-MIT",
    "/LICENSE-APACHE",
]

[features]
default = ["default-font"]
# Bundle Cascadia Mono (+ DejaVu Sans Mono as glyph fallback) so `Config::default()` just works.
default-font = []

[dependencies]
bytemuck = { version = "1.25", features = ["derive"] }
fontdue = "0.9"
glam = "0.34"
pollster = "1"
wgpu = "30.0.2"
winit = "0.30.13"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
lto = "thin"
